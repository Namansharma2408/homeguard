name: Build and deploy HomeGuard AI to MonsterASP.NET

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: netforge.client/package-lock.json

      - name: Restore backend
        run: dotnet restore NetForge.Server/NetForge.Server.csproj

      - name: Build frontend
        working-directory: netforge.client
        run: |
          npm ci
          npm run build

      - name: Add frontend files to the ASP.NET project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force NetForge.Server/wwwroot | Out-Null
          Copy-Item -Path netforge.client/dist/* -Destination NetForge.Server/wwwroot -Recurse -Force

      - name: Run backend tests
        run: |
          dotnet test tests/Tests.Unit/NetForge.Tests.Unit.csproj --configuration Release
          dotnet test tests/Tests.Integration/NetForge.Tests.Integration.csproj --configuration Release

      - name: Publish the single ASP.NET website
        run: dotnet publish NetForge.Server/NetForge.Server.csproj --configuration Release --no-restore --output ./publish

      - name: Verify the combined publish output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/wwwroot/index.html)) { throw 'Frontend index.html is missing from publish/wwwroot.' }
          if (-not (Get-ChildItem publish/wwwroot/assets -File -ErrorAction SilentlyContinue)) { throw 'Vite assets are missing from publish/wwwroot/assets.' }
          if (-not (Test-Path publish/NetForge.Server.SqlServerMigrations.dll)) { throw 'SQL Server migrations assembly is missing from the publish output.' }

      - name: Keep the deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeguard-monsterasp
          path: publish/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to MonsterASP.NET through Web Deploy
        if: github.event_name != 'pull_request'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
